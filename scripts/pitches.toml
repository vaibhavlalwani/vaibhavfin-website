W7134948737 = "Uses a large language model to pull stock calls from YouTubers across nine countries. The calls predict one-month returns, but not longer-horizon moves or lasting profits."
W4394678977 = "Shows the aggregate earnings-returns link is stronger for large-cap and growth stocks than for small-cap and value stocks, with implications for factor investors."
